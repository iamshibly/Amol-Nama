spring.application.name=amolnama
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/afsos_nama}
spring.datasource.username=${DATABASE_USERNAME:afsos}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=AFSOS_SESSION
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=-1s

app.pilot.privacy-contact=${PRIVACY_CONTACT_EMAIL:}
