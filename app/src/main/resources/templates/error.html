<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong | AmolNama</title>
    <link rel="icon" th:href="@{/images/brand-logo.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/design-v3.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="error-body">
<main class="error-page">
    <div class="error-visual"><img th:src="@{/images/brand-logo.svg}" alt="AmolNama"><span>!</span></div>
    <span class="page-kicker">Unexpected error</span>
    <h1>Something went wrong.</h1>
    <p>The page could not be completed. Return to the dashboard and try again.</p>
    <section aria-label="Error details" style="margin:20px auto; padding:16px; border:1px solid #d9e1ec; border-radius:12px; max-width:560px; font-size:14px; overflow-wrap:anywhere; background:#f7f9fc;">
        <strong>Error details · D2</strong>
        <p style="margin:6px 0">Reference: <span th:text="${errorReference != null ? errorReference : 'UNAVAILABLE'}">UNAVAILABLE</span></p>
        <p style="margin:6px 0">Status: <span th:text="${diagnosticStatus != null ? diagnosticStatus : (status != null ? status : 'UNAVAILABLE')}">UNAVAILABLE</span></p>
        <p style="margin:6px 0">Code: <span th:text="${diagnosticCode != null ? diagnosticCode : 'ERROR_DISPATCH'}">ERROR_DISPATCH</span></p>
    </section>
    <div class="error-actions"><a class="button button-blue" th:href="@{/dashboard}"><svg class="icon"><use href="/images/ui-icons.svg#dashboard"></use></svg>Dashboard</a><a class="button button-ghost" href="javascript:history.back()">Go Back</a></div>
</main>
</body>
</html>
